name: transcribe
on:
  push:
    branches: [midia-redes]
    paths: ['voz/transcribe.txt']
permissions:
  contents: write
jobs:
  tr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: midia-redes }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faster-whisper==1.0.3
      - name: transcribe
        run: |
          python - <<'PY'
          import json
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          for line in open("voz/transcribe.txt"):
              f = line.strip()
              if not f: continue
              segs, info = m.transcribe("voz/" + f, language="pt", word_timestamps=True)
              words = []
              for s in segs:
                  for w in s.words:
                      words.append({"w": w.word, "s": round(w.start, 3), "e": round(w.end, 3)})
              json.dump(words, open("voz/" + f + ".json", "w"), ensure_ascii=False, indent=0)
          PY
      - name: commit
        run: |
          git config user.name "media-bot"
          git config user.email "media-bot@users.noreply.github.com"
          git add voz
          git commit -m "media: transcripts" || echo nothing
          git push
