name: transcribe
on:
  push:
    branches: [midia-redes]
    paths: ['voz/transcribe.txt']
permissions:
  contents: write
jobs:
  tr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: midia-redes }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faster-whisper
      - name: transcribe
        run: python voz/tr.py
      - name: commit
        run: |
          git config user.name "media-bot"
          git config user.email "media-bot@users.noreply.github.com"
          git add voz
          git commit -m "media: transcripts" || echo nothing
          git push
